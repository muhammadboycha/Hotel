<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Register Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative min-h-screen bg-white">


    <!-- Overlay -->
    

    <!-- Form Container -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4 ">
        <div class="w-full sm:max-w-2xl p-6 sm:p-8 rounded-2xl shadow-lg backdrop-blur-md bg-gray-100">
            <h2 class="text-3xl font-bold text-center text-blue-700 mb-6">Registration</h2>
            <h2 class="block text-[25px] font-medium text-blue-700 mb-2">Owner Details</h2>
            
            <h2 class="text-md font-semibold text-blue-700 mb-4 text-red-400">
                ⚠️ Note: Please 
                <a href="D:\hotel\policy.html" class="text-blue-600 underline hover:text-blue-800 transition">
                  Read the Guidelines
                </a>
              </h2>
        
               
                 <form class="space-y-5">
                <!-- Owner Details -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Owner Name *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mobile *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Address *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">District *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pincode *</label>
                        <input type="number" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Aadhar *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">PAN <span
                                class="text-gray-400">optional</span></label>
                        <input type="tel" placeholder=""
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>

                </div>

                <!-- Bank Details -->
                <h3 class="text-xl font-semibold mt-6 text-blue-700">Bank Details *</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Account Number *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Branch *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">IFSC *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>
                </div>

                <!-- Document Images -->
                <h3 class="text-xl font-semibold mt-6 text-blue-700">Upload Document Images *</h3>

                <!-- Document Upload Field -->
                <div class="mt-2">
                    <input type="file" name="documentImages" id="documentImages" multiple accept=".jpg,.jpeg,.png,.pdf"
                        class="block w-full text-sm text-gray-700 
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-lg file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-100 file:text-blue-700
                        hover:file:bg-blue-200 cursor-pointer" />
                    <p class="text-xs text-gray-500 mt-1">Accepted formats: JPG, PNG, PDF. You can upload multiple
                        files.</p>
                </div>


                <!-- Properties -->
                <h3 class="text-xl font-semibold mt-6 text-blue-700"> Property Details*</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Property Name *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                        <textarea class="w-full px-4 py-2 border rounded-lg"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Distance *</label>
                        <input type="text" value="" class="w-full px-4 py-2 border rounded-lg" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Owner Name *</label>
                        <input type="text" value=" " class="w-full px-4 py-2 border rounded-lg" />
                    </div>

                    <div>
                        <label for="policies" class="block text-sm font-medium text-gray-700 mb-1">Policies *</label>
                        <textarea name="policies" placeholder="Enter policies,"
                            class="w-full px-4 py-2 border rounded-lg0 border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-700"
                            rows="4"></textarea>
                    </div>


                    <!-- Script to Add New Policy Input -->


                    <div>
                        <label for="amenities" class="block text-sm font-medium text-gray-700 mb-1">Amenities *</label>
                        <textarea name="amenities"
                            placeholder="Enter amenities, one per line (e.g. Parking lot, Caretaker)"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-700"
                            rows="4"></textarea>
                    </div>



                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Upload Images *</label>

                        <!-- Image Input -->
                        <input id="imageUpload" type="file" multiple accept="image/*"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700" />

                        <!-- Image Preview Area -->
                        <div id="imagePreview" class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
                    </div>




                    <div id="roomsContainer">
                        <!-- Initial Room -->
                        <div class="room-entry border p-4 rounded-lg mb-4 bg-gray-50">
                            <h4 class="text-lg font-medium text-blue-700 mb-2">Room 1</h4>

                            <!-- Category Dropdown -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                            <select class="w-full px-4 py-2 border rounded-lg mb-2">
                                <option value="">Select Category</option>
                                <option value="standard">Standard</option>
                                <option value="deluxe">Deluxe</option>
                                <option value="suite">Suite</option>
                                <option value="family">Family Room</option>
                                <option value="single">Single</option>
                                <option value="double">Double</option>
                            </select>

                            <!-- Price -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">Price *</label>
                            <input type="number" placeholder="Enter price"
                                class="w-full px-4 py-2 border rounded-lg mb-2" />

                            <!-- Beds -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">Beds *</label>
                            <input type="number" placeholder="Enter number of beds"
                                class="w-full px-4 py-2 border rounded-lg mb-2" />

                            <!-- Pax -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">Pax (Guests) *</label>
                            <input type="number" placeholder="Enter max guests (pax)"
                                class="w-full px-4 py-2 border rounded-lg mb-2" />

                            <!-- Bath -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">Bath *</label>
                            <input type="text" placeholder="Enter bath type or count"
                                class="w-full px-4 py-2 border rounded-lg mb-2" />

                        </div>
                    </div>


                    <!-- Add Room Button -->
                    <button id="addRoomBtn"
                        class="mt-2 mb-6 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
                        Add Room
                    </button>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200 font-semibold mt-6">
                    Submit Registration
                </button>
            </form>
        </div>
    </div>

</body>

</html>
